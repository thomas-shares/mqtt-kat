status = warn
name = mqtt-kat

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5level [%t] %logger{1.} - %msg%n

# The broker logs a line per packet at DEBUG, so INFO is the useful default:
# lifecycle only. Drop these to debug (or trace) to follow a message flow.
# Two entries because the Clojure namespaces are mqttkat.* while the Java
# classes they call into are org.mqttkat.*.
logger.mqttkat.name = mqttkat
logger.mqttkat.level = info

logger.mqttkat-java.name = org.mqttkat
logger.mqttkat-java.level = info

rootLogger.level = warn
rootLogger.appenderRef.console.ref = console
