name: test

on:
  push:
    branches: [master, main]
  pull_request:

# A newer push to the same branch or PR supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          lein: 2.11.2

      # Keyed on project.clj: a dependency change starts a fresh cache, and
      # the restore key still brings back everything that did not change.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.lein
          key: m2-${{ runner.os }}-${{ hashFiles('project.clj') }}
          restore-keys: m2-${{ runner.os }}-

      - run: lein deps

      # The :default selector leaves out the ^:performance load simulations.
      - run: lein test

  # The ^:portable tests, which reach the broker only through its socket, run
  # against Mosquitto instead of mqtt-kat. Both brokers speak 3.1.1 and 5 on
  # the one listener, and the tests choose their own version, so one run covers
  # both. A test that fails here is either wrong about MQTT or has found a
  # place where mqtt-kat and Mosquitto disagree.
  mosquitto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          lein: 2.11.2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.lein
          key: m2-${{ runner.os }}-${{ hashFiles('project.clj') }}
          restore-keys: m2-${{ runner.os }}-

      - run: lein deps

      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            -v "$PWD/test/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2.0.22
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "mosquitto did not open 1883"; docker logs mosquitto; exit 1

      - name: Run the portable tests against Mosquitto
        env:
          MQTT_BROKER_HOST: 127.0.0.1
          MQTT_BROKER_PORT: "1883"
        run: lein test :mosquitto

      # Again, against the same broker and what the first run left on it:
      # sessions with time to live and retained messages. That is how the
      # suite meets a broker someone keeps running locally, and a test that
      # reuses a name from the run before fails here rather than there.
      - name: Run them again against the same Mosquitto
        env:
          MQTT_BROKER_HOST: 127.0.0.1
          MQTT_BROKER_PORT: "1883"
        run: lein test :mosquitto

      - if: always()
        run: docker logs mosquitto > "$RUNNER_TEMP/mosquitto.log" 2>&1 || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosquitto-log
          path: ${{ runner.temp }}/mosquitto.log

  # The Paho MQTT 5 interoperability suite, run against the broker as a
  # separate process: the unit tests above only prove the broker agrees with
  # a client written alongside it. scripts/paho_v5.py decides the outcome and
  # lists the failures it tolerates for now.
  paho-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          lein: 2.11.2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.lein
          key: m2-${{ runner.os }}-${{ hashFiles('project.clj') }}
          restore-keys: m2-${{ runner.os }}-

      # Pinned, so a change upstream cannot turn this red on its own.
      - name: Fetch the Paho test suite
        run: |
          git clone --quiet https://github.com/eclipse/paho.mqtt.testing.git "$RUNNER_TEMP/paho"
          git -C "$RUNNER_TEMP/paho" checkout --quiet 9d7bb80

      # Without -Dmqttkat.rama, so no Rama cluster is needed.
      - name: Start the broker
        run: |
          nohup lein run 1883 8081 > "$RUNNER_TEMP/broker.log" 2>&1 &
          for i in $(seq 1 180); do
            if (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "broker did not open 1883"; cat "$RUNNER_TEMP/broker.log"; exit 1

      - name: Run the Paho MQTT 5 suite
        timeout-minutes: 15
        run: python3 scripts/paho_v5.py "$RUNNER_TEMP/paho/interoperability"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-log
          path: ${{ runner.temp }}/broker.log

  # scripts/chaos.bb against one broker with an in-process Rama: clients are
  # killed, disconnected and move their subscriptions while publishers publish
  # at QoS 0, 1 and 2, and afterwards every message is checked against what
  # its QoS promised. Blocking since the bugs it found were fixed (see
  # thoughts.md, 20260929). The report is kept either way.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          lein: 2.11.2
          bb: 1.12.200

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.lein
          key: m2-${{ runner.os }}-${{ hashFiles('project.clj') }}
          restore-keys: m2-${{ runner.os }}-

      - run: lein uberjar

      - name: Chaos run, one broker
        run: bb scripts/chaos.bb chaos/single-broker.edn

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          path: |
            logs/chaos/
            logs/brokers/
